name: Qualidade e segurança

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Sincronizar dependências bloqueadas
        run: uv sync --locked
      - name: Validar API instalada
        run: |
          uv pip check
          uv run python -I -c "from api.index import app; from backend.services import schedule; assert callable(app)"
      - name: Sincronizar e validar a versão
        run: uv run npm run check
