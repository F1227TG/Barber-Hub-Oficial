                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/support/tickets:
    get:
      summary: List Support Tickets
      operationId: list_support_tickets_api_v1_support_tickets_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      summary: Create Support Ticket
      operationId: create_support_ticket_api_v1_support_tickets_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
