  /api/v1/marketplace/search:
    get:
      summary: Marketplace Search
      operationId: marketplace_search_api_v1_marketplace_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Q
      - name: tipo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(barbearia|salao|todos)?$
          - type: 'null'
          title: Tipo
      - name: agenda
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Agenda
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(aberta|fechada|todos)?$
          - type: 'null'
          title: Status
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 24
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
