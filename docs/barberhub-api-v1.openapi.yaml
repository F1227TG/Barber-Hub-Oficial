openapi: 3.1.0
info:
  title: Barber Hub API
  version: 1.1.0
  description: API própria do Barber Hub em Python/FastAPI.
servers:
  - url: https://barberhuboficial.vercel.app
paths:
  /api/v1/health:
    get:
      summary: Estado da API
      responses:
        '200': { description: API disponível }
  /api/v1/catalog/summary:
    get:
      summary: Indicadores públicos
      responses:
        '200': { description: Resumo público }
  /api/v1/appointments:
    post:
      summary: Cria agendamento com múltiplos serviços
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Agendamento criado }
        '422': { description: Dados ou regra de negócio inválidos }
  /api/v1/support/tickets:
    get:
      summary: Lista tickets do usuário
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Tickets encontrados }
    post:
      summary: Cria ticket de suporte
      responses:
        '201': { description: Ticket criado }
  /api/v1/account:
    delete:
      summary: Exclui a própria conta
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Conta excluída }
  /api/v1/admin/overview:
    get:
      summary: Resumo administrativo
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Resumo retornado }
  /api/v1/admin/users/{user_id}/password-recovery:
    post:
      summary: Envia recuperação de senha ao titular
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: user_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: E-mail solicitado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
