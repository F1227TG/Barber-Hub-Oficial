openapi: 3.1.0
info:
  title: Barber Hub API
  description: API própria do Barber Hub, executada em Python/FastAPI.
  version: 1.2.0
paths:
  /api/v1/health:
    get:
      summary: Health
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/catalog/summary:
    get:
      summary: Catalog Summary
      operationId: catalog_summary_api_v1_catalog_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/marketplace/search:
    get:
      summary: Marketplace Search
      operationId: marketplace_search_api_v1_marketplace_search_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Q
      - name: tipo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(barbearia|salao|todos)?$
          - type: 'null'
          title: Tipo
      - name: agenda
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Agenda
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(aberta|fechada|todos)?$
          - type: 'null'
          title: Status
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 24
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/marketplace/featured:
    get:
      summary: Marketplace Featured
      operationId: marketplace_featured_api_v1_marketplace_featured_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 12
          minimum: 1
          default: 6
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/appointments:
    post:
      summary: Create Appointment
      operationId: create_appointment_api_v1_appointments_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/appointments/{appointment_id}/status:
    patch:
      summary: Update Appointment Status
      operationId: update_appointment_status_api_v1_appointments__appointment_id__status_patch
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          title: Appointment Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/appointments/{appointment_id}:
    delete:
      summary: Cancel Appointment
      operationId: cancel_appointment_api_v1_appointments__appointment_id__delete
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          title: Appointment Id
      - name: authorization
