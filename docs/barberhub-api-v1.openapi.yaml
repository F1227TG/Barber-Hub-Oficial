        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
          - type: 'null'
          title: State
      - name: open_now
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Open Now
      - name: agenda
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Agenda
      - name: latitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 90
            minimum: -90
          - type: 'null'
          title: Latitude
      - name: longitude
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 180
            minimum: -180
          - type: 'null'
          title: Longitude
      - name: radius_km
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            maximum: 500
            exclusiveMinimum: 0
          - type: 'null'
          title: Radius Km
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 10000
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 60
          minimum: 1
          default: 24
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
