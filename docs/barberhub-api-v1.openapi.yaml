    get:
      summary: Marketplace Regional
      operationId: marketplace_regional_api_v1_marketplace_regional_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Q
      - name: city
        in: query
