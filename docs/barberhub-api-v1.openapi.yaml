components:
  schemas:
    AppointmentCancelRequest:
      properties:
        motivo:
          type: string
          maxLength: 500
          minLength: 3
          title: Motivo
          default: Cancelado pelo cliente
      type: object
      title: AppointmentCancelRequest
    AppointmentCreate:
      properties:
        estabelecimento_id:
          type: string
          format: uuid
          title: Estabelecimento Id
        profissional_id:
          type: string
          format: uuid
          title: Profissional Id
        servicos_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 8
          minItems: 1
          title: Servicos Ids
        data:
          type: string
          format: date
          title: Data
        hora_inicio:
          type: string
          format: time
          title: Hora Inicio
        observacao:
          anyOf:
          - type: string
            maxLength: 800
          - type: 'null'
          title: Observacao
      type: object
      required:
      - estabelecimento_id
      - profissional_id
      - servicos_ids
      - data
      - hora_inicio
      title: AppointmentCreate
    AppointmentStatusUpdate:
      properties:
        status:
          type: string
          enum:
          - confirmado
          - concluido
          - recusado
          - cancelado
          title: Status
        motivo:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Motivo
      type: object
      required:
      - status
      title: AppointmentStatusUpdate
    DeleteAccountRequest:
      properties:
        confirmacao:
          type: string
          maxLength: 80
          title: Confirmacao
      type: object
      required:
      - confirmacao
      title: DeleteAccountRequest
    EstablishmentStatusUpdate:
      properties:
        status:
          type: string
          enum:
          - automatico
          - aberto
          - fechado
          title: Status
        motivo:
          anyOf:
          - type: string
            maxLength: 240
          - type: 'null'
          title: Motivo
      type: object
      required:
      - status
      title: EstablishmentStatusUpdate
    EstablishmentUpdate:
      properties:
        nome:
          anyOf:
          - type: string
            maxLength: 140
            minLength: 2
          - type: 'null'
          title: Nome
        descricao:
          anyOf:
          - type: string
            maxLength: 3000
          - type: 'null'
          title: Descricao
        email_publico:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email Publico
        telefone:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Telefone
        whatsapp:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Whatsapp
        instagram:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Instagram
        tiktok:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Tiktok
        website:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Website
        cep:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Cep
        cidade:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Cidade
        estado:
          anyOf:
          - type: string
            maxLength: 2
            minLength: 2
          - type: 'null'
          title: Estado
        bairro:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Bairro
        endereco:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Endereco
        numero:
          anyOf:
          - type: string
            maxLength: 30
          - type: 'null'
          title: Numero
        complemento:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Complemento
        foto_url:
          anyOf:
          - type: string
            maxLength: 1200
          - type: 'null'
          title: Foto Url
        capa_url:
          anyOf:
          - type: string
            maxLength: 1200
          - type: 'null'
          title: Capa Url
        status_manual:
          anyOf:
          - type: string
            enum:
            - automatico
            - aberto
            - fechado
          - type: 'null'
          title: Status Manual
        motivo_status:
          anyOf:
          - type: string
            maxLength: 240
          - type: 'null'
          title: Motivo Status
        aceita_agendamento:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Aceita Agendamento
        intervalo_slots_min:
          anyOf:
          - type: integer
            maximum: 180.0
            minimum: 10.0
          - type: 'null'
          title: Intervalo Slots Min
        antecedencia_min_horas:
          anyOf:
          - type: integer
            maximum: 168.0
            minimum: 0.0
          - type: 'null'
          title: Antecedencia Min Horas
        limite_dias_agendamento:
          anyOf:
          - type: integer
            maximum: 365.0
            minimum: 1.0
          - type: 'null'
          title: Limite Dias Agendamento
      type: object
      title: EstablishmentUpdate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PasswordRecoveryRequest:
      properties:
        motivo:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
          title: Motivo
      type: object
      title: PasswordRecoveryRequest
    ProfessionalCreate:
      properties:
        estabelecimento_id:
          type: string
          format: uuid
          title: Estabelecimento Id
        nome:
          type: string
          maxLength: 140
          minLength: 2
          title: Nome
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        telefone:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Telefone
        especialidade:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Especialidade
        bio:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Bio
        avatar_url:
          anyOf:
          - type: string
            maxLength: 1200
          - type: 'null'
          title: Avatar Url
        ativo:
          type: boolean
          title: Ativo
          default: true
        aceita_agendamento:
          type: boolean
          title: Aceita Agendamento
          default: true
      type: object
      required:
      - estabelecimento_id
      - nome
      title: ProfessionalCreate
    ProfessionalUpdate:
      properties:
        nome:
          anyOf:
          - type: string
            maxLength: 140
            minLength: 2
          - type: 'null'
          title: Nome
        email:
          anyOf:
          - type: string
            format: email
          - type: 'null'
          title: Email
        telefone:
          anyOf:
          - type: string
            maxLength: 40
          - type: 'null'
          title: Telefone
        especialidade:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Especialidade
        bio:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Bio
        avatar_url:
          anyOf:
          - type: string
            maxLength: 1200
          - type: 'null'
          title: Avatar Url
        ativo:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ativo
        aceita_agendamento:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Aceita Agendamento
      type: object
      title: ProfessionalUpdate
    ServiceCreate:
      properties:
        estabelecimento_id:
          type: string
          format: uuid
          title: Estabelecimento Id
        nome:
          type: string
          maxLength: 140
          minLength: 2
          title: Nome
        categoria:
          type: string
          maxLength: 100
          minLength: 2
          title: Categoria
          default: Serviço
        descricao:
          type: string
          maxLength: 2000
          title: Descricao
          default: ''
        preco:
          anyOf:
          - type: number
            maximum: 1000000.0
            minimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Preco
        duracao_min:
          type: integer
          maximum: 480.0
