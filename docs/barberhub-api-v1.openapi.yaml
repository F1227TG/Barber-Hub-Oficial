              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/professionals/{professional_id}:
    patch:
      summary: Update Professional
      operationId: update_professional_api_v1_professionals__professional_id__patch
      parameters:
      - name: professional_id
        in: path
        required: true
