name: Qualidade e segurança

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências JavaScript bloqueadas
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
      - name: Sincronizar dependências bloqueadas
        run: uv sync --locked
      - name: Validar API instalada
        run: |
          uv pip check
          uv run python -I -c "from api.index import app; from backend.services import schedule; assert callable(app)"
      - name: Sincronizar e validar a versão
        run: uv run npm run check
      - name: Guardar resultados de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks
          path: test-results/checks.json

  browser:
    # Snapshots are generated with pinned Chromium on Windows, including local font fixtures.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar testes de navegador
        run: |
          npm install --global pnpm@10.11.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium
      - run: npm run check:browser
      - run: npm run check:visual
      - name: Guardar falhas de navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
