              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/account:
    delete:
      summary: Delete Account
      operationId: delete_account_api_v1_account_delete
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
